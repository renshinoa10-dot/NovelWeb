<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <radialGradient id="nebula" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)" />
  <circle cx="260" cy="220" r="160" fill="url(#nebula)" />
  
  <!-- Stars -->
  <circle cx="80" cy="100" r="1.5" fill="#fff" opacity="0.8" />
  <circle cx="140" cy="80" r="1" fill="#fff" opacity="0.6" />
  <circle cx="320" cy="110" r="2" fill="#fff" opacity="0.9" />
  <circle cx="70" cy="250" r="1.5" fill="#fff" opacity="0.7" />
  <circle cx="340" cy="320" r="1.2" fill="#fff" opacity="0.8" />
  <circle cx="200" cy="150" r="2.5" fill="#fff" opacity="0.9" />
  <circle cx="120" cy="380" r="1" fill="#fff" opacity="0.5" />

  <!-- Planet & Rings -->
  <ellipse cx="220" cy="240" rx="90" ry="16" fill="none" stroke="#a78bfa" stroke-width="2.5" transform="rotate(-20 220 240)" opacity="0.7"/>
  <circle cx="220" cy="240" r="55" fill="#4338ca" />
  <ellipse cx="220" cy="240" rx="90" ry="16" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="120 400" transform="rotate(-20 220 240)"/>

  <!-- Badge Genre -->
  <rect x="40" y="40" width="80" height="26" rx="13" fill="#6366f1" fill-opacity="0.3" stroke="#818cf8" stroke-width="1" />
  <text x="80" y="57" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#c7d2fe" text-anchor="middle">SCI-FI</text>

  <!-- Typography -->
  <text x="40" y="440" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5">LEMBAH</text>
  <text x="40" y="475" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="url(#gold)" letter-spacing="-0.5">BINTANG</text>
  <text x="40" y="505" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Menembus Horizon</text>

  <line x1="40" y1="530" x2="360" y2="530" stroke="#334155" stroke-width="1" />
  <text x="40" y="555" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">Oleh: Ahmad Rian</text>
</svg>
