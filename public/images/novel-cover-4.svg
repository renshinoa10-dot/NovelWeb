  <text x="40" y="475" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#facc15" letter-spacing="-0.5">PAVILIUN NO. 13</text>
  <text x="40" y="505" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="500" fill="#a1a1aa">Teka-teki Ruang Terkunci</text>

